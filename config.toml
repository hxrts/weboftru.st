base_url = "https://weboftru.st"
title = "Web of Trust"
description = "A web of trust"
compile_sass = true
minify_html = true
generate_feeds = true
feed_filenames = ["rss.xml"]

[markdown]
highlight_code = true
highlight_theme = "base16-ocean-light"
extra_syntaxes_and_themes = ["syntaxes"]
smart_punctuation = true

[extra]
# Author attribution for article metadata
author = "Sam Hart"
# Fallback image for social cards when a page has no cover_image
default_og_image = "/images/happening-score.webp"
# Optional: set to "@handle" to emit twitter:creator / twitter:site
# twitter_handle = "@hxrts"
