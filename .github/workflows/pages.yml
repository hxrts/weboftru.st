name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate image manifest
        run: ./scripts/generate-image-manifest.sh

      - name: Install build dependencies
        run: npm ci

      - name: Install diagram renderer browser
        run: npx playwright install --with-deps chromium

      - name: Restore compiled diagrams
        uses: actions/cache@v4
        with:
          path: .cache/diagrams
          key: diagrams-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            diagrams-v1-${{ runner.os }}-

      - name: Build site
        run: npm run build

      - name: Check static diagrams
        run: npm run test:diagrams

      - name: Check diagram cache
        run: npm run test:diagram-cache

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
